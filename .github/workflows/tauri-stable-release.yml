name: Publish Tauri 0.5.0 stable release

on:
  push:
    branches:
      - feature/tauri-promotion
    paths:
      - ".github/workflows/tauri-stable-release.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Download successful Tauri 0.5.0 Windows build
        uses: actions/download-artifact@v4
        with:
          name: SuperMarkdown-Tauri-Windows
          run-id: 44490544581
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-assets

      - name: Verify installer and generate SHA256
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath "release-assets" -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Tauri installer, found $($installers.Count)."
          }
          $installer = $installers[0]
          if ($installer.Length -ne 8210389) {
            throw "Unexpected installer size: $($installer.Length) bytes (expected 8210389)."
          }
          $stableName = "SuperMarkdown-0.5.0-windows-x64-setup.exe"
          Rename-Item -LiteralPath $installer.FullName -NewName $stableName
          $installer = Get-Item -LiteralPath (Join-Path "release-assets" $stableName)
          $digest = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($installer.Name)" | Set-Content -Path "release-assets/SHA256SUMS.txt" -Encoding utf8
          Write-Host "Verified $($installer.Name): $($installer.Length) bytes, SHA256 $digest"
          @'
          # SuperMarkdown v0.5.0 — Tauri 2 / Windows x64

          SuperMarkdown v0.5.0 是 Tauri 2 桌面版的首个正式发行包，适用于 Windows x64。

          ## 本次构建验证
          - Windows GitHub Actions 构建成功
          - Rust 单元测试：8 项通过
          - 现有 Node.js 文件测试：通过
          - cargo check --locked：通过
          - NSIS 安装包构建成功，大小 8,210,389 bytes（约 7.83 MiB）
          - 安装包 SHA256 见 SHA256SUMS.txt

          ## 安装前须知
          - 安装包尚未进行代码签名，Windows SmartScreen 可能显示安全提示。
          - 应用依赖系统 Microsoft Edge WebView2 Runtime；内网或离线终端需预先部署运行时。
          - 正式版数据目录为 %APPDATA%\\local.supermarkdown，与 Electron 版及旧 POC 的数据目录隔离。
          - POC 草稿与偏好不会自动迁移；需要时请先关闭两个版本，再按项目文档手动迁移。

          ## 仍需人工验证
          CI 通过不等于所有 Windows 交互已完成验收。中文输入法、文件关联、拖放、恢复、WebView2 缺失/离线安装、覆盖安装以及启动和内存表现仍建议在目标设备检查。

          源码分支：feature/tauri-promotion
          应用版本：0.5.0
          '@ | Set-Content -Path "release-notes.md" -Encoding utf8

      - name: Publish stable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-Item -LiteralPath "release-assets/SuperMarkdown-0.5.0-windows-x64-setup.exe"
          gh release create "v0.5.0" $installer.FullName "release-assets/SHA256SUMS.txt" --repo "Chenzy-zero/SuperMarkdown" --target "${{ github.sha }}" --title "SuperMarkdown v0.5.0 · Tauri 2 (Windows x64)" --notes-file "release-notes.md" --latest
