name: Tauri POC checks

on:
  push:
    branches:
      - experiment/tauri-poc
    paths:
      - "src-tauri/**"
      - "src/app/**"
      - "tools/prepare-tauri-frontend.cjs"
      - "docs/tauri-poc.md"
      - ".github/workflows/tauri-poc.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare Tauri frontend
        run: node tools/prepare-tauri-frontend.cjs
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Run existing Node.js file tests
        run: pnpm test
      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Build unsigned Tauri POC NSIS installer
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Record Windows installer size
        shell: pwsh
        run: |
          $packages = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction Stop
          foreach ($package in $packages) {
            "Tauri POC NSIS: $($package.Name) = $($package.Length) bytes" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SuperMarkdown-Tauri-POC-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
